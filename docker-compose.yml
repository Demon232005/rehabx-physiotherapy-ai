version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rehabx-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://rehabx:rehabx_secret@postgres:5432/rehabx_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rehabx_db
      - POSTGRES_USER=rehabx
      - POSTGRES_PASSWORD=rehabx_secret
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rehabx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: rehabx-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rehabx-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rehabx-postgres
    environment:
      - POSTGRES_DB=rehabx_db
      - POSTGRES_USER=rehabx
      - POSTGRES_PASSWORD=rehabx_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - rehabx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehabx -d rehabx_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  rehabx-network:
    driver: bridge
