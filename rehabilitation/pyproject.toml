[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehabx-rehabilitation"
version = "1.0.0"
description = "RehabX AI - clinician-approved hand/wrist rehabilitation knowledge base and recommendation engine"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["rehabilitation*"]

[tool.setuptools.package-data]
rehabilitation = ["knowledge_base/*.json"]
